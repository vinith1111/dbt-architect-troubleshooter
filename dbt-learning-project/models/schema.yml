version: 2

models:
  - name: stg_customers
    description: Cleaned customer records from the customers seed.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null
  - name: stg_orders
    description: Cleaned order records.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  - name: stg_payments
    description: Cleaned payment records.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
  - name: fct_orders
    description: One row per order, including paid amount.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
  - name: dim_customers
    description: Customer dimension with order counts.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
